<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirm your Synapse email</title></head>
<body style="margin:0;padding:24px 12px;background:#f0f0e8;font-family:Arial,sans-serif;color:#343c30;">
  <table role="presentation" style="width:100%;max-width:560px;margin:0 auto;border-collapse:collapse;background:#faf9f5;border:1px solid #e6e5dc;">
    <tr><td style="padding:28px 28px 12px;font-size:24px;font-weight:bold;color:#65704a;">synapse.</td></tr>
    <tr><td style="padding:12px 28px 28px;">
      <h1 style="margin:0 0 16px;font-size:22px;line-height:1.4;">Confirm your email</h1>
      <p style="margin:0 0 20px;font-size:15px;line-height:1.6;">Enter this OTP in Synapse to confirm your email address.</p>
      <p style="margin:0 0 20px;padding:18px 12px;border:1px solid #d4ddc5;background:#eef1e3;text-align:center;font-size:28px;font-weight:bold;line-height:1.5;overflow-wrap:anywhere;">{{ .Token }}</p>
      <p style="margin:0 0 16px;font-size:14px;line-height:1.6;">This code is for one-time use and expires shortly. Request a new code in Synapse if needed. Do not share it with anyone.</p>
      <p style="margin:0;font-size:13px;line-height:1.6;color:#777a6c;">If you did not create a Synapse account, you can ignore this email.</p>
    </td></tr>
  </table>
</body>
</html>
